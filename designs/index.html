<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ignat 摄影作品</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300;500;600;800&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script defer src="assets/app.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">IGNAT</div>
  <nav><a href="#" aria-current="page">作品</a><a href="#">关于</a><a href="#">联系</a><button id="editToggle" aria-pressed="false" hidden>编辑模式</button></nav>
</header>

<!-- 地图 -->
<section class="atlas" aria-label="拍摄地点地图">
  <div class="edge top"><span id="edgeYears">IGNAT ATLAS</span><span class="muted">底片上的世界</span><span id="edgeCount"></span></div>
  <div class="map" id="map">
    <canvas id="mapCanvas" width="2400" height="1144" aria-hidden="true"></canvas>
    <svg id="mapSvg"></svg>
    <div class="loading" id="mapLoading">正在冲洗地图……</div>
    <div class="title"><h1>Places<br>&amp; Frames</h1><p>走过的地方，拍下的底片</p></div>
    <div class="tip" id="tip"></div>
  </div>
  <div class="edge bot"><span id="edgeCoord">把鼠标放在亮起的国家上</span><span class="muted">点击跳到印样</span></div>
</section>

<!-- 地区 + 类别：符合条件的亮着，其余压暗 -->
<div class="bar">
  <div class="rolls" id="rolls" role="group" aria-label="按地区筛选"></div>
  <div class="toggle" id="toggle" role="group" aria-label="按类别筛选">
    <button data-type="all" aria-pressed="true">全部</button>
    <button data-type="人文" aria-pressed="false">人文</button>
    <button data-type="风景" aria-pressed="false">风景</button>
  </div>
</div>

<!-- 印样：按拍摄时间排 -->
<main class="sheet" id="sheet"><div class="empty">正在读取照片……</div></main>
<footer><span>按拍摄时间排列，没有日期的照片排在最后。</span><span>© Ignat</span></footer>

<div class="loupe" id="loupe" aria-hidden="true"><div class="inner" id="loupeInner"></div></div>

<!-- 取景器 -->
<div class="vf" id="vf" role="dialog" aria-modal="true" aria-label="全屏看图" aria-hidden="true">
  <div class="bg" id="vfBg"></div>
  <img class="photo" id="vfPreview" alt="" hidden>
  <img class="photo" id="vfImg" alt="" hidden>
  <div class="vstatus" id="vfStatus" role="status"><span id="vfLoadText"></span><button id="vfRetry" hidden>重新加载</button></div>
  <div class="frm" aria-hidden="true"><i></i><i></i><i></i><i></i><div class="af" id="vfAf"></div></div>
  <div class="vtop"><span><span id="vfRoll"></span><span class="filt" id="vfFilt"></span></span><button class="vclose" id="vfClose">关闭（Esc）</button></div>
  <button class="zone prev" id="vfPrev" aria-label="上一张"></button>
  <button class="zone next" id="vfNext" aria-label="下一张"></button>
  <div class="hint">← → 翻页　F 铺满</div>
  <div class="lcd">
    <div class="cap"><h2><span id="vfTitle"></span><span class="place" id="vfPlace"></span></h2><span class="count" id="vfCount"></span></div>
    <div class="readout">
      <div><small>快门</small><strong id="vfS"></strong></div>
      <div><small>光圈</small><strong id="vfF"></strong></div>
      <div><small>ISO</small><strong id="vfIso"></strong></div>
      <div><small>焦距</small><strong id="vfMm"></strong></div>
      <div class="gear" id="vfGear"></div>
      <div class="mini" id="vfMini" hidden><img id="vfMiniImg" alt=""><i id="vfMiniDot"></i></div>
    </div>
  </div>

  <!-- 编辑面板：只在本地编辑服务器下出现，改动自动保存到 shared/photos.json -->
  <aside class="ed" id="ed" hidden aria-label="编辑照片信息">
    <div class="ed-h"><b>编辑这张</b><span id="edFile"></span></div>
    <div class="ed-review" id="edReview" hidden>
      <p>这张还在待审核。核对下面的标题、城市、类别和元数据（AI 推测的可能有错），没问题再通过。</p>
      <button type="button" id="edApprove">审核通过，并入作品</button>
    </div>
    <label class="f"><span>标题</span><input data-k="title" placeholder="给这张起个名字"></label>
    <div class="f"><span>城市</span><div class="chips" id="edCity" role="radiogroup" aria-label="城市"></div></div>
    <div class="f"><span>类别</span><div class="chips" id="edType" role="radiogroup" aria-label="类别"></div></div>
    <label class="f"><span>具体地点（可空）</span><input data-k="spot" placeholder="例如 红场"></label>
    <label class="chk"><input type="checkbox" data-k="pick">用红笔圈出来（精选）</label>
    <div class="sep"></div>
    <label class="f"><span>拍摄时间</span><input type="datetime-local" step="1" data-k="taken"></label>
    <div class="grid">
      <label class="f"><span>快门</span><input data-k="s" placeholder="1/250"></label>
      <label class="f"><span>光圈 F</span><input data-k="f" placeholder="4"></label>
      <label class="f"><span>ISO</span><input data-k="iso" data-num inputmode="numeric" placeholder="400"></label>
      <label class="f"><span>焦距 mm</span><input data-k="mm" data-num inputmode="numeric" placeholder="50"></label>
    </div>
    <label class="f"><span>相机</span><input data-k="camera" list="dlCamera" placeholder="Nikon Z7 II"></label>
    <label class="f"><span>镜头</span><input data-k="lens" list="dlLens" placeholder="NIKKOR Z 24-120mm f/4 S"></label>
    <div class="grid">
      <label class="f"><span>纬度</span><input data-k="lat" data-num inputmode="decimal" placeholder="55.75"></label>
      <label class="f"><span>经度</span><input data-k="lon" data-num inputmode="decimal" placeholder="37.62"></label>
    </div>
    <datalist id="dlCamera"></datalist><datalist id="dlLens"></datalist>
    <div class="ed-s" id="edStatus" role="status"></div>
    <p class="ed-tip">虚线框 = 原图里没有这项信息。改完自动保存；← → 翻页时会带着编辑面板。</p>
  </aside>
</div>

</body>
</html>
